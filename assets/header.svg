<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f" />
      <stop offset="50%" stop-color="#070b1a" />
      <stop offset="100%" stop-color="#050710" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#22d3ee" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="30%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ambient"><feGaussianBlur stdDeviation="40" /></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#22d3ee" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 900; font-size: 52px; letter-spacing: 6px; text-transform: uppercase; }
    .sub { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; }
    .badge { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; fill: #22d3ee; }
    .pulse { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0% { opacity: .4; } 50% { opacity: 1; } 100% { opacity: .4; } }
  </style>

  <rect width="900" height="220" rx="14" fill="url(#bg-grad)" />
  <circle cx="150" cy="70" r="90" fill="#22d3ee" opacity="0.16" filter="url(#ambient)" />
  <circle cx="750" cy="120" r="110" fill="#818cf8" opacity="0.18" filter="url(#ambient)" />
  <rect width="900" height="220" rx="14" fill="url(#grid)" />
  <rect x="1.5" y="1.5" width="897" height="217" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.7" />

  <path d="M 12 30 L 12 14 L 30 14" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 888 30 L 888 14 L 870 14" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 12 190 L 12 206 L 30 206" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 888 190 L 888 206 L 870 206" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" />

  <g transform="translate(315, 24)">
    <rect width="270" height="26" rx="13" fill="#08111c" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.7" />
    <circle cx="18" cy="13" r="5" fill="#22d3ee" class="pulse" />
    <text x="145" y="17.5" text-anchor="middle" class="badge">BUILDING REAL-WORLD SOFTWARE</text>
  </g>

  <text x="450" y="108" text-anchor="middle" class="title" fill="url(#glow-grad)" filter="url(#glow)">MADHU MANOJ</text>
  <text x="450" y="108" text-anchor="middle" class="title" fill="#ffffff" fill-opacity="0.95">MADHU MANOJ</text>

  <text x="450" y="142" text-anchor="middle" class="sub">
    <tspan fill="#22d3ee">COMPUTER SCIENCE ENGINEER</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#f1f5f9">FULL STACK</tspan>
    <tspan fill="#64748b"> &#8226; </tspan>
    <tspan fill="#818cf8">AI/ML &amp; IoT</tspan>
  </text>

  <g transform="translate(0, 160)">
    <line x1="200" y1="0" x2="420" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8" />
    <polygon points="450,-5 455,0 450,5 445,0" fill="#22d3ee" filter="url(#glow)" />
    <line x1="480" y1="0" x2="700" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8" />
  </g>

  <text x="450" y="192" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    <tspan fill="#22d3ee">&lt;/&gt;</tspan> BUILD IT. SHIP IT. ITERATE.
  </text>
</svg>
